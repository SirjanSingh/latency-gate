name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Differential check, every symbol (map book vs flat book)
        run: |
          ./build/lg-gen --seed 42 --messages 1000000 --out synth.itch
          for l in 1 2 3 4; do ./build/lg-replay synth.itch --locate $l --check; done
